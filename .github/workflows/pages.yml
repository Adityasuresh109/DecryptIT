name: Release DecryptIT (Worker + Pages)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'worker/**'
      - 'tests/**'
      - 'word-packs.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: decryptit-agency-production
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Checkout audited source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Gameplay, word pack, privacy and reconnect tests
        run: npm test

      - name: Twenty-five player simulated load check
        run: npm run load

      - name: Require Cloudflare deployment credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::DecryptIT needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID GitHub Actions secrets before the Worker can deploy."
            exit 1
          fi

      - name: Deploy Cloudflare Worker and Durable Object
        id: worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.jsonc

      - name: Verify live Worker and configure static site
        env:
          DEPLOYMENT_URL: ${{ steps.worker.outputs.deployment-url }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.parse
          raw = os.environ.get('DEPLOYMENT_URL','').strip()
          # Some action versions add " (custom domain)" after the URL.
          raw = raw.split(' (',1)[0].strip()
          if raw and not raw.startswith(('http://','https://')):
              raw = 'https://' + raw
          parsed = urllib.parse.urlparse(raw)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.username or parsed.password or parsed.path not in ('','/'):
              raise SystemExit('Cloudflare did not provide a usable HTTPS deployment URL. Do not publish a disconnected frontend.')
          base = f'https://{parsed.netloc}'
          import time, urllib.error
          status = None
          for attempt in range(1, 13):
              try:
                  request = urllib.request.Request(f'{base}/health', headers={
                      'User-Agent': 'DecryptIT-Release-Check/1.0',
                      'Accept': 'application/json'
                  })
                  with urllib.request.urlopen(request, timeout=20) as resp:
                      status = json.load(resp)
                  if status.get('service') == 'decryptit' and status.get('wordPacksReady') is True:
                      print(f'Production Worker ready on attempt {attempt}', flush=True)
                      break
                  print(f'Attempt {attempt}: unexpected health: {status}', flush=True)
              except urllib.error.HTTPError as exc:
                  print(f'Attempt {attempt}: HTTP {exc.code}; headers={dict(exc.headers)}; '
                        f'body={exc.read(600)!r}', flush=True)
              except Exception as exc:
                  print(f'Attempt {attempt}: {type(exc).__name__}: {exc}', flush=True)
              if attempt < 12:
                  time.sleep(5)
          else:
              raise SystemExit('Worker health did not confirm DecryptIT + 800 curated words. Refusing to publish.')
          pathlib.Path('frontend/config.js').write_text(
              '// Generated at release from actual Wrangler deployment URL.\nwindow.DECRYPTIT_WORKER_URL = ' +
              json.dumps(base) + ';\n', encoding='utf-8')
          print('Worker:',base,'health:',status)
          PY

      - name: Verify generated config is executable JavaScript
        run: |
          node --check frontend/config.js
          node - <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const raw = fs.readFileSync('frontend/config.js', 'utf8');
          if (!raw.includes('\nwindow.DECRYPTIT_WORKER_URL = ') || raw.includes('\\n')) {
            throw new Error('Worker config contains literal escaped newlines, not real line breaks.');
          }
          const context = {window:{}};
          vm.runInNewContext(raw, context);
          if (!/^https:\/\/[^/]+\.workers\.dev$/.test(context.window.DECRYPTIT_WORKER_URL)) {
            throw new Error('Worker URL is not an HTTPS workers.dev endpoint.');
          }
          console.log('Verified executable config assignment to', context.window.DECRYPTIT_WORKER_URL);
          JS

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package configured static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Publish GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Verify public config bytes and live room create/join
        env:
          LIVE_PAGE: ${{ steps.pages.outputs.page_url }}
          DEPLOYMENT_URL: ${{ steps.worker.outputs.deployment-url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          page=os.environ['LIVE_PAGE'].rstrip('/')+'/'
          worker=os.environ['DEPLOYMENT_URL'].strip().split(' (',1)[0].rstrip('/')
          if not worker.startswith('https://'):
              worker='https://'+worker
          def get(url):
              req=urllib.request.Request(url, headers={'Cache-Control':'no-cache', 'User-Agent':'DecryptIT-Smoke/1.0'})
              with urllib.request.urlopen(req,timeout=20) as resp:
                  return resp.read()
          expected=f'window.DECRYPTIT_WORKER_URL = {json.dumps(worker)};'
          for attempt in range(1,13):
              try:
                  page_html=get(page+'?sha='+os.environ['GITHUB_SHA']).decode('utf-8')
                  config=get(page+'config.js?sha='+os.environ['GITHUB_SHA']).decode('utf-8')
                  if '<title>DecryptIT' in page_html and '\n'+expected in config and '\\n' not in config:
                      print('Verified published config.js actual newlines on attempt',attempt,flush=True)
                      break
                  print('Pages propagation attempt',attempt,'HTML title matches?', '<title>DecryptIT' in page_html,
                        'assignment after real newline?', '\n'+expected in config,
                        'contains bad literal escapes?', '\\n' in config,flush=True)
              except Exception as exc:
                  print('Pages propagation attempt',attempt,'failed:',type(exc).__name__,str(exc),flush=True)
              time.sleep(5)
          else:
              raise SystemExit('Published page/config mismatch after deployment. Not signed off.')
          def post(path,data):
              req=urllib.request.Request(worker+path,data=json.dumps(data).encode('utf-8'),
                  headers={'Content-Type':'application/json','Origin':'https://adityasuresh109.github.io'},method='POST')
              with urllib.request.urlopen(req,timeout=20) as resp:
                  return json.load(resp)
          created=post('/api/create',{'mode':'family','bestOf':3,'timer':120})
          if not created.get('code') or not created.get('token'):
              raise SystemExit('Live room creation failed.')
          joined=post('/api/join',{'code':created['code'],'name':'Release QA'})
          if joined.get('code')!=created['code'] or not joined.get('token'):
              raise SystemExit('Live room join failed.')
          print('Verified live Worker create/join for room',created['code'],flush=True)
          PY

      - name: Record deployed addresses
        env:
          LIVE_PAGE: ${{ steps.pages.outputs.page_url }}
          DEPLOYMENT_URL: ${{ steps.worker.outputs.deployment-url }}
        run: |
          echo "### DecryptIT live deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: $LIVE_PAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Source revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Simulated acceptance suite passed. Physical iOS/Android venue testing remains a separate release gate." >> "$GITHUB_STEP_SUMMARY"
